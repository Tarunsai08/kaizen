name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install & build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Kaizen-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kaizen-APK
          path: Kaizen-v${{ github.run_number }}.apk

      # Publishes a GitHub Release so you can download the APK straight from your phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kaizen v1.0.${{ github.run_number }}
          files: Kaizen-v${{ github.run_number }}.apk
          body: Open this page on your phone, tap the .apk to download, then install it.
